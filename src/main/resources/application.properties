# 🌟🌟🌟 Configuración General de la Aplicación 🌟🌟🌟
spring.application.name=artiles-photography-backend
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# 🔑 Configuración OAuth2 de Google 🔑
google.oauth.client-id=778922090669-0r3kqj6ks2ffmcvjclpucot348asfu0d.apps.googleusercontent.com
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET: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}
google.oauth.redirect-uri=http://localhost:8080/api/calendar/callback
google.calendar.time-zone=America/Santo_Domingo
# Para producción: google.oauth.redirect-uri=https://artilesphotography.com/api/calendar/callback

# 🔒 Seguridad 🔒
# En producción, habilita HTTPS con un certificado válido
# server.ssl.key-store=classpath:keystore.p12
# server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
# server.ssl.key-store-type=PKCS12
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.prefix=access_log
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.pattern=combined

# 📅 Formato de Fecha y Zona Horaria 📅
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# 🌐 Compresión HTTP para Mejorar Rendimiento 🌐
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=512

# 🔠 Codificación y Charset 🔠
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true

# 🗃️ Configuración de Base de Datos 🗃️
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/photography_db?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:arojas}
spring.datasource.password=${DB_PASSWORD:@Emulador1}
# Para producción (ejemplo con AWS RDS):
# spring.datasource.url=jdbc:mysql://db-photography-instance.cf8meey26f67.us-east-2.rds.amazonaws.com:3306/photography_db?serverTimezone=UTC&useSSL=true
# spring.datasource.username=${DB_USERNAME}
# spring.datasource.password=${DB_PASSWORD}

# 🛠️ Configuración de Hibernate (ORM) 🛠️
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.connection.characterEncoding=utf8
spring.jpa.properties.hibernate.connection.useUnicode=true

# ⚡ Pool de Conexiones Hikari ⚡
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=PhotographyHikariPool

# 🔐 Configuración JWT 🔐
security.jwt.secret=${JWT_SECRET:4b7d9e2f8c1a3d6e9f2b5c8a1d3e6f9b2c5a8d1e3f6b9c2a5d8e1f3b6c9a2d5}
security.jwt.expiration=86400000
security.jwt.issuer=artiles-photography

# 📊 Actuator y Métricas 📊
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.exposure.exclude=env,beans
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always
management.metrics.enable.jdbc=true
management.metrics.enable.hikaricp=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.sla.http.server.requests=50ms,100ms,200ms

# ☁️ Cloudinary ☁️
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dxl74pu2l}
cloudinary.api-key=${CLOUDINARY_API_KEY:298346514227718}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:0zDVk2QDAUKjnk8B2uT438jbOaU}

# 📂 Tamaño Máximo de Archivos 📂
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.servlet.multipart.resolve-lazily=true

# 🌍 CORS 🌍
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:5173,https://artilesphotography.com
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allowed-headers=Authorization,Content-Type,X-Requested-With,Accept
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

# ⚡ Caché (Caffeine) ⚡
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=3600s,recordStats=true

# 🚨 Manejo de Errores 🚨
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false

# 📜 Configuración de Logs 📜
logging.level.root=INFO
logging.level.com.artilesphotography=DEBUG
logging.level.com.google.api.client=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/artiles-photography-backend.log
logging.file.max-size=10MB
logging.file.max-history=10
logging.file.total-size-cap=100MB

# 📈 Plausible Analytics 📈
plausible.api.url=https://plausible.io/api/v1
plausible.api.key=${PLAUSIBLE_API_KEY:HTWjSBeRyQcwOzAD6G64Udxm3Q-S2VGxmBM8PZ4cg9ceBMxOx_iMwyPwCgzUoCIK}
plausible.domain=artilesphotography.com
spring.scheduling.cron.timezone=America/Santo_Domingo

# 📧 Configuración de Email 📧
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:infoartilesphotography@gmail.com}
spring.mail.password=${MAIL_PASSWORD:wcvzltfwiufnhtkw}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# 🛡️ Encabezados de Seguridad 🛡️
server.forward-headers-strategy=framework
spring.security.headers.cache-control=true
spring.security.headers.content-security-policy=default-src 'self'
spring.security.headers.frame-options=DENY
spring.security.headers.xss-protection=true
spring.security.headers.content-type-options=true
spring.security.headers.referrer-policy=strict-origin-when-cross-origin

# 🔄 Configuración de Sesiones 🔄
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=Strict