# 🌟🌟🌟 Configuración General de la Aplicación 🌟🌟🌟
spring.application.name=artiles-photography-backend
server.port=8080

# 🔒 Seguridad: En producción, usa HTTPS si es posible
# server.ssl.key-store=classpath:keystore.p12
# server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
# server.ssl.key-store-type=PKCS12

# 📅 Formato de Fecha y Zona Horaria
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=America/Santo_Domingo

# 🌐 Compresión HTTP para mejorar rendimiento
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=1024

# 🔠 Codificación y Charset
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# 🗃️ Configuración de Base de Datos 🗃️
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# En producción, usa una URL de base de datos remota y asegúrate de que use SSL
spring.datasource.url=jdbc:mysql://localhost:3306/photography_db?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:arojas}
spring.datasource.password=${DB_PASSWORD:@Emulador1}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# spring.datasource.username=${DB_USERNAME:arojas}
# spring.datasource.password=${DB_PASSWORD:Emulador25}
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# spring.datasource.url=jdbc:mysql://db-photography-instance.cf8meey26f67.us-east-2.rds.amazonaws.com:3306/photography_db?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
# 🛠️ Configuración de Hibernate (ORM)
# En producción, considera usar "validate" para evitar cambios automáticos
spring.jpa.hibernate.ddl-auto=update
# Desactiva en producción para reducir logs
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Evita problemas de rendimiento
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Santo_Domingo
spring.jpa.properties.hibernate.generate_statistics=false

# ⚡ Pool de Conexiones Hikari (Optimizado para Producción)
# Aumentado para manejar más conexiones
spring.datasource.hikari.minimum-idle=10
# Ajustado para tráfico moderado
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000

# 🔐 Configuración JWT
# Asegúrate de definir esta variable en el entorno
security.jwt.secret=${JWT_SECRET:MI_CLAVE_SECRETA_SUPER_SEGURA}
# 24 horas
security.jwt.expiration=86400000
security.jwt.issuer=artiles-photography

# 📊 Actuator y Métricas
management.endpoints.web.exposure.include=health,info,metrics
management.endpoints.web.exposure.exclude=env,beans,loggers
management.endpoint.health.show-details=when-authorized
management.endpoint.metrics.access=read-only
management.metrics.enable.jdbc=true
management.metrics.enable.hikaricp=true

# ☁️ Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dxl74pu2l}
cloudinary.api-key=${CLOUDINARY_API_KEY:298346514227718}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:0zDVk2QDAUKjnk8B2uT438jbOaU}

# 📂 Tamaño Máximo de Archivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# 🌍 CORS (Frontend URLs permitidas)
# En producción, limita los orígenes permitidos a tu dominio real
spring.web.cors.allowed-origins=https://artilesphotography.com,http://localhost:3000,http://localhost:5173,http://localhost/,http://artiles.local:8080,http://artiles.local:3000,http://3.144.121.87
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allowed-headers=Authorization,Content-Type

# ⚡ Caché (Caffeine)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=3600s

# 🚨 Manejo de Errores (Seguro para Producción)
# No exponer mensajes de error al cliente
server.error.include-message=never
server.error.include-binding-errors=never
# No exponer stacktraces en producción
server.error.include-stacktrace=never

# 📜 Configuración de Logs 📜
# Nivel de logging para producción: INFO para reducir ruido
logging.level.root=INFO
# logging.level.org.springframework=DEBUG
logging.level.org.springframework=DEBUG
logging.level.com.artiles_photography_backend=DEBUG
logging.level.com.google.api.client=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
# Mostrar logs en consola con un formato claro
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
# Guardar logs en un archivo para monitoreo
logging.file.name=logs/artiles-photography-backend.log
# Rotación de logs: tamaño máximo y número de archivos
logging.file.max-size=10MB
logging.file.max-history=10
# Formato de logs en archivo
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

