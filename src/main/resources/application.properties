# ================================================================================================
# 📊 ACTUATOR Y MÉTRICAS
# ================================================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers
management.endpoints.web.exposure.exclude=env,beans,heapdump,threaddump
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always
management.endpoint.loggers.enabled=true
management.metrics.enable.jdbc=true
management.metrics.enable.hikaricp=true
management.metrics.enable.jvm=true
management.metrics.enable.tomcat=true
management.metrics.enable.system=true
management.metrics.tags.application=artiles-photography-backend
management.metrics.tags.environment=local
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.sla.http.server.requests=50ms,100ms,200ms,500ms,1s
management.metrics.web.server.request.autotime.enabled=true
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
